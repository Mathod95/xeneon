name: Companion

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "companion/**"
      - "widgets/dot-clock/**"
      - "widgets/dot-steam/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Dot Companion (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: cargo build --release --locked --manifest-path companion/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dot-companion
          path: companion/target/release/dot-companion.exe
      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash companion/target/release/dot-companion.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii companion/target/release/dot-companion.exe.sha256 "$h  dot-companion.exe"
      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            companion/target/release/dot-companion.exe
            companion/target/release/dot-companion.exe.sha256
