name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widgets:
    name: Widgets iCUE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer le CLI officiel Corsair
        run: npm install -g icuewidget-cli@0.4.48
      - name: Valider et empaqueter
        run: ./scripts/package-widgets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: widgets
          path: dist/*.icuewidget

  tools:
    name: Outils Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler edge-swipe-test
        working-directory: tools/edge-swipe-test
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: tools/edge-swipe-test/target/release/edge-swipe-test.exe

  release:
    name: Publier la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [widgets, tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
