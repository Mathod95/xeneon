name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widgets:
    name: Widgets iCUE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer le CLI officiel Corsair
        run: npm install -g icuewidget-cli@0.4.48
      - name: Valider et empaqueter
        run: ./scripts/package-widgets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: widgets
          path: dist/*.icuewidget

  release:
    name: Publier la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [widgets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # seule la coquille Dot Hub est publiée : les autres widgets sont des modules servis par le compagnon
      - uses: softprops/action-gh-release@v2
        with:
          files: out/dot-hub.icuewidget
