[package]
name = "dot-companion"
version = "0.3.0"
edition = "2021"
description = "Compagnon Windows de Dot Hub : sert l'interface des modules et leur configuration, sur 127.0.0.1 uniquement."
license = "MIT"
publish = false

[dependencies]
tiny_http = "0.12"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
