<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dot Hub · Réglages</title>
<style>
@font-face { font-family: "Fira Code"; src: url("/m/clock/resources/fonts/FiraCode-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fira Code"; src: url("/m/clock/resources/fonts/FiraCode-Medium.woff2") format("woff2"); font-weight: 500; }
:root { --bg: #080808; --panel: #121212; --line: #232323; --lit: #f2f0e9; --label: #b8b6b0; --muted: #7d7b76; --accent: #10b981; --red: #ed403b;
  --mono: "Fira Code", Consolas, monospace; --brand: "Segoe UI", Selawik, system-ui, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--bg); }
/* fond en points, le même que Dot Page et les maquettes */
body { margin: 0; background: var(--bg) radial-gradient(circle, #161616 1.2px, transparent 1.6px) 0 0 / 22px 22px; color: var(--lit); font: 15px/1.5 var(--brand); padding: 28px max(16px, 4vw) 64px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .22em; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
h1 { margin: 0; font: 500 28px var(--mono); letter-spacing: .04em; }
.lbl { font: 12px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.hint { color: var(--muted); margin: 0; }
.status { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 20px; display: grid; gap: 18px; }
.card header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.card header .grow { flex: 1; }
input[type=text], select { font: 14px var(--mono); color: var(--lit); background: #0b0b0b; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 0; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
button { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--label); background: #0b0b0b; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
button:hover { color: var(--lit); border-color: #3a3a3a; }
button.danger:hover { color: var(--red); border-color: var(--red); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px 24px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.inline { display: flex; align-items: center; gap: 12px; }
.field span { color: var(--label); font-size: 14px; }
.lbl.sub { color: var(--muted); margin: 0; }
.update { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; color: var(--label); font-size: 14px; }
button.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); }
button.primary:hover { color: var(--bg); filter: brightness(1.1); }
a { color: var(--accent); }
/* réglages d'un module dans la carte d'aperçu : au style des maquettes de référence */
.settings { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: #0a0a0a; }
.settings label { display: inline-flex; align-items: center; gap: 10px; font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.settings input[type=color] { width: 36px; height: 28px; }
.settings input[type=checkbox], .settings input[type=radio] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.settings select, .settings input[type=text], .settings input[type=password] { font-size: 13px; padding: 6px 8px; background: #141414; }
.settings input[type=text], .settings input[type=password] { width: 16em; max-width: 100%; letter-spacing: .06em; }
.settings .grp { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.settings .preset { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 11px; letter-spacing: .1em; }
.settings .preset i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.settings .grp > span { font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--lit); }
/* l'écran de la XENEON EDGE, en direct : la carte DOT HUB et chaque page */
.pagebar { display: flex; flex-wrap: wrap; gap: 12px; }
.edge { padding: clamp(6px, 1.2%, 18px); border-radius: clamp(10px, 1.6vw, 24px); background: linear-gradient(180deg, #161616, #0b0b0b); border: 1px solid #2a2a2a; box-shadow: 0 40px 80px -40px #000, inset 0 1px 0 #262626; }
.screen { position: relative; aspect-ratio: 2560 / 720; overflow: hidden; border-radius: clamp(3px, .5vw, 8px); background: #000; }
.native { position: absolute; left: 0; top: 0; width: 2560px; height: 720px; transform-origin: 0 0; }
.slot { position: absolute; left: 12px; top: 12px; border-radius: 12px; overflow: hidden; background: #080808; }
.slot iframe { display: block; width: 100%; height: 100%; border: 0; background: #080808; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">MATHOD</span><span class="status" id="saved"></span></div>
  <div style="display:grid;gap:8px">
    <h1>Dot Hub · Réglages</h1>
    <p class="hint">Dot Hub, puis une page par module : touche « + » pour ajouter une page, choisis son module d'un toucher sur « DOT », règle-le en le voyant en direct. Les pages sont les tuiles de l'accueil sur l'Edge.</p>
  </div>
  <div id="list" style="display:grid;gap:16px"></div>
</div>
<script>
(function () {
	"use strict";
	var MODULES = [], SCHEMAS = {}, saveTimers = {}, THEME_KEYS = [];
	// écrans : la carte DOT HUB puis une carte par page (XL) ; couleurs communes
	var THEME = null, PREVIEW = { size: "xl", cards: [] };
	var MASK = "••••••••", SECRET = /apikey|secret|token|password/i;
	var SLOTS = { xl: [2536, 696], l: [1688, 696], m: [840, 696], s: [840, 344] };
	var THEME_LABELS = { dotAccentColor: "Accent color", litDotColor: "Lit dot color", unlitDotColor: "Unlit dot color", labelColor: "Label color" };
	function lit(v) { try { return Function("return (" + v + ")")(); } catch (e) { return v; } }
	function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
	function flash(t) { var s = document.getElementById("saved"); s.textContent = t; clearTimeout(flash.t); flash.t = setTimeout(function () { s.textContent = ""; }, 1500); }

	// schéma d'un module = ses balises x-icue-property et x-icue-groups
	function schema(id) {
		if (SCHEMAS[id]) return Promise.resolve(SCHEMAS[id]);
		return fetch("/m/" + id + "/index.html").then(function (r) { return r.text(); }).then(function (html) {
			var doc = new DOMParser().parseFromString(html, "text/html"), props = {}, groups = [];
			doc.querySelectorAll('meta[name="x-icue-property"]').forEach(function (m) {
				var key = m.getAttribute("content");
				props[key] = {
					key: key, type: m.getAttribute("data-type"),
					label: lit(m.getAttribute("data-label") || "''") || key,
					def: lit(m.getAttribute("data-default") || "''"),
					values: m.getAttribute("data-values") ? lit(m.getAttribute("data-values")) : null
				};
			});
			var g = doc.getElementById("x-icue-groups");
			try { groups = JSON.parse(g ? g.textContent : "[]"); } catch (e) { groups = []; }
			groups = groups.map(function (x) { return { title: lit(x.title), keys: x.properties.filter(function (k) { return props[k]; }) }; });
			var used = {}; groups.forEach(function (x) { x.keys.forEach(function (k) { used[k] = 1; }); });
			var rest = Object.keys(props).filter(function (k) { return !used[k]; });
			if (rest.length) groups.push({ title: "Other", keys: rest });
			return (SCHEMAS[id] = { props: props, groups: groups });
		});
	}

	// carte « Paramètres globaux » : communes à tous les modules et à toutes les instances
	function themeCard(t) {
		var c = el("section", "card theme-card"), head = el("header");
		head.appendChild(el("h2", "lbl", "Paramètres globaux"));
		c.appendChild(head);
		c.appendChild(el("p", "lbl sub", "Couleurs · tous les modules"));
		var theme = Object.assign({}, t.theme), grid = el("div", "grid");
		THEME_KEYS.forEach(function (k) {
			var f = el("label", "field inline"), w = el("input"); w.type = "color"; w.value = String(theme[k]).slice(0, 7); w.setAttribute("data-key", k);
			w.addEventListener("input", function () { THEME[k] = w.value.toUpperCase(); pushPreview(); saveTheme(THEME); });
			f.appendChild(w); f.appendChild(el("span", "", THEME_LABELS[k] || k)); grid.appendChild(f);
		});
		c.appendChild(grid);
		var reset = el("button", "", "Valeurs par défaut");
		reset.style.justifySelf = "start";
		reset.addEventListener("click", function () { saveTheme(Object.assign({}, t.defaults), true); });
		c.appendChild(reset);
		// démarrage avec Windows (clé Run de l'utilisateur, réglée par le compagnon)
		c.appendChild(el("p", "lbl sub", "Dot Companion"));
		var st = el("label", "field inline"), cb = el("input"); cb.type = "checkbox"; cb.disabled = true;
		var stText = el("span", "", "Lancer Dot Companion au démarrage de Windows");
		st.appendChild(cb); st.appendChild(stText); c.appendChild(st);
		fetch("/api/startup").then(function (r) { return r.json(); }).then(function (j) {
			cb.checked = !!j.enabled; cb.disabled = !j.supported;
			if (!j.supported) stText.textContent += " (seulement sous Windows)";
		}).catch(function () {});
		cb.addEventListener("change", function () {
			fetch("/api/startup", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: cb.checked }) })
				.then(function (r) { return r.json(); })
				.then(function (j) { cb.checked = !!j.enabled; flash(j.ok ? (j.enabled ? "Démarrera avec Windows" : "Ne démarrera plus avec Windows") : "Erreur"); })
				.catch(function () { flash("Erreur"); });
		});
		// mise à jour depuis l'app : version, dernière release GitHub, bouton pour installer
		var up = el("div", "update"), upText = el("span", "", "Dot Companion"), upBtn = el("button", "", "Rechercher une mise à jour");
		up.appendChild(upText); up.appendChild(upBtn); c.appendChild(up);
		var upState = null;
		function showUpdate(j) {
			upState = j;
			var when = j.checked ? " · vérifié à " + new Date(j.checked).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
			if (j.installing) { upText.textContent = "Installation de la version " + j.latest + "… le compagnon redémarre"; upBtn.hidden = true; return; }
			upBtn.hidden = false;
			if (j.available) { upText.textContent = "Dot Companion " + j.current + " · version " + j.latest + " disponible"; upBtn.textContent = "Mettre à jour vers " + j.latest; upBtn.className = "primary"; }
			else { upText.textContent = "Dot Companion " + j.current + (j.checking ? " · vérification…" : j.error ? " · " + j.error : " · à jour" + when); upBtn.textContent = "Rechercher une mise à jour"; upBtn.className = ""; }
		}
		function pollUpdate() { fetch("/api/update").then(function (r) { return r.json(); }).then(function (j) { showUpdate(j); if (j.checking) setTimeout(pollUpdate, 1500); }).catch(function () {}); }
		upBtn.addEventListener("click", function () {
			var install = upState && upState.available;
			fetch("/api/update/" + (install ? "install" : "check"), { method: "POST" }).then(function (r) { return r.json(); }).then(function (j) {
				showUpdate(j);
				if (install) waitRestart(upState && upState.current); else setTimeout(pollUpdate, 1500);
			}).catch(function () {});
		});
		// après « Mettre à jour » : on attend que le compagnon redémarre sur la nouvelle version, puis on recharge la page
		function waitRestart(from) {
			var tries = 0;
			(function again() {
				fetch("/api/health", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (h) {
					if (h.version && h.version !== from) location.reload();
					else if (++tries < 80) setTimeout(again, 1500);
				}).catch(function () { if (++tries < 80) setTimeout(again, 1500); });
			})();
		}
		pollUpdate();
		return c;
	}
	var themeTimer = null;
	function saveTheme(theme, reload) {
		clearTimeout(themeTimer);
		themeTimer = setTimeout(function () {
			fetch("/api/theme", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(theme) })
				.then(function (r) { flash(r.ok ? "Enregistré" : "Erreur"); if (reload) load(); });
		}, 250);
	}

	// ---------------------------------------------------------------- l'écran de l'Edge, en direct
	// Carte DOT HUB (toujours là) : l'accueil de Dot Hub, une tuile par page, puis une carte vide « + ».
	// Toucher « + » ajoute en dessous une page vide (« ● DOT ») ; toucher « DOT » propose les modules ; le module choisi
	// est enregistré comme page (POST /api/pages), tourne en direct, avec ses réglages dessous au style des maquettes.
	// Les pages sont communes à tous les Dot Hub : sur l'Edge, l'accueil montre les mêmes tuiles.
	function screenCard(cls) {
		var c = el("section", "card preview " + cls);
		var edge = el("div", "edge"), screen = el("div", "screen"), nat = el("div", "native"), slot = el("div", "slot");
		var dims = SLOTS[PREVIEW.size]; // XL seulement pour l'instant
		slot.style.width = dims[0] + "px"; slot.style.height = dims[1] + "px";
		nat.appendChild(slot); screen.appendChild(nat); edge.appendChild(screen); c.appendChild(edge);
		var fit = function () { nat.style.transform = "scale(" + (screen.clientWidth / 2560) + ")"; };
		if (window.ResizeObserver) new ResizeObserver(fit).observe(screen); else window.addEventListener("resize", fit);
		setTimeout(fit, 0);
		return { el: c, slot: slot, frame: null, id: null, module: null, settings: {}, panel: null, bar: null, hub: false };
	}
	function hubCard() {
		var card = screenCard("hub"), head = el("header");
		head.appendChild(el("h2", "lbl", "Dot Hub"));
		card.el.insertBefore(head, card.el.firstChild);
		card.hub = true;
		PREVIEW.cards.push(card); frameFor(card);
		return card.el;
	}
	// une page (sans titre) : enregistrée (pg = { id, module, settings }) ou vide (pg = null, en attente d'un module)
	function pageCard(pg) {
		var card = screenCard("page");
		if (pg) { card.id = pg.id; card.module = pg.module; card.settings = Object.assign({}, pg.settings || {}); }
		PREVIEW.cards.push(card); frameFor(card);
		if (card.module) panelFor(card);
		barFor(card);
		return card;
	}
	function frameFor(card) {
		card.slot.innerHTML = "";
		var f = el("iframe"), empty = !card.hub && !card.module;
		f.title = card.module ? "Aperçu du module" : "Aperçu de Dot Hub";
		// la maquette de référence du compagnon remplit le cadre elle-même (pas de compagnon derrière)
		if (window.__dotPreviewFrame) window.__dotPreviewFrame(f, "", { module: card.module, name: "" }, { blank: empty, page: card.id || "" });
		else f.src = (card.module ? "/m/" + card.module + "/?preview=1&page=" + encodeURIComponent(card.id) : "/home?preview=1" + (empty ? "&blank=1" : ""));
		f.addEventListener("load", function () { pushPreview(card); if (card.hub) pushPages(); });
		card.frame = f; card.slot.appendChild(f);
	}
	// pages enregistrées : une tuile chacune sur l'accueil de la carte DOT HUB
	function pushPages() {
		var hub = PREVIEW.cards.filter(function (c) { return c.hub; })[0];
		if (!hub || !hub.frame || !hub.frame.contentWindow) return;
		var pages = PREVIEW.cards.filter(function (c) { return c.id; }).map(function (c) { return { id: c.id, module: c.module }; });
		hub.frame.contentWindow.postMessage({ type: "dot-pages", pages: pages }, "*");
	}
	// réglages et couleurs communes : envoyés tout de suite aux aperçus
	function pushPreview(only) {
		PREVIEW.cards.forEach(function (card) {
			if ((only && card !== only) || !card.frame || !card.frame.contentWindow) return;
			card.frame.contentWindow.postMessage({ type: "dot-preview", settings: card.settings, theme: THEME }, "*");
		});
	}
	// réglages d'une page : l'aperçu suit tout de suite, l'enregistrement part 250 ms plus tard
	function savePage(card) {
		if (!card.id) return;
		clearTimeout(saveTimers[card.id]);
		saveTimers[card.id] = setTimeout(function () {
			fetch("/api/page/" + encodeURIComponent(card.id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings: card.settings }) })
				.then(function (r) { flash(r.ok ? "Enregistré" : "Erreur"); }).catch(function () { flash("Erreur"); });
		}, 250);
	}
	// réglages d'un module au style des maquettes de référence : générés depuis ses balises x-icue-property
	// (2 ou 3 choix : boutons radio ; plus : liste ; interrupteur : case ; texte ; couleur = couleur commune)
	function panelFor(card) {
		if (card.panel) card.panel.remove();
		var box = el("div", "settings"); card.panel = box;
		card.el.insertBefore(box, card.bar || null);
		schema(card.module).then(function (sc) {
			var keys = [];
			sc.groups.forEach(function (g) { g.keys.forEach(function (k) { keys.push(k); }); });
			var val = function (k) { var p = sc.props[k]; if (THEME_KEYS.indexOf(k) >= 0) return THEME[k]; return k in card.settings ? card.settings[k] : p.def; };
			function draw() {
				box.innerHTML = "";
				keys.forEach(function (k) {
					var p = sc.props[k], v = val(k);
					// « customX » ne s'affiche que si le choix lié vaut « custom » (ex. customDateFormat ↔ dateFormat)
					var rel = /^custom[A-Z]/.test(k) ? k.charAt(6).toLowerCase() + k.slice(7) : null;
					if (rel && sc.props[rel] && val(rel) !== "custom") return;
					var set = function (nv) {
						if (THEME_KEYS.indexOf(k) >= 0) { THEME[k] = nv; saveTheme(THEME); syncThemeCard(); }
						else { card.settings[k] = nv; savePage(card); }
						pushPreview(); if (rel === null && sc.props["custom" + k.charAt(0).toUpperCase() + k.slice(1)]) draw();
					};
					if (p.type === "combobox" && p.values && p.values.length <= 3) {
						var g = el("div", "grp"); g.setAttribute("role", "radiogroup"); g.setAttribute("aria-label", p.label);
						g.appendChild(el("span", "", p.label));
						var name = "r" + Math.random().toString(36).slice(2);
						p.values.forEach(function (o) {
							var l = el("label"), r = el("input"); r.type = "radio"; r.name = name; r.value = o.key; r.checked = String(v) === String(o.key);
							r.addEventListener("change", function () { if (r.checked) set(o.key); });
							l.appendChild(r); l.appendChild(document.createTextNode(" " + o.value)); g.appendChild(l);
						});
						box.appendChild(g); return;
					}
					var lab = el("label"), w;
					if (p.type === "switch") { w = el("input"); w.type = "checkbox"; w.checked = v === true || v === "true"; w.addEventListener("change", function () { set(w.checked); }); lab.appendChild(w); lab.appendChild(document.createTextNode(" " + p.label)); box.appendChild(lab); return; }
					lab.appendChild(document.createTextNode(p.label + " "));
					if (p.type === "color") { w = el("input"); w.type = "color"; w.value = String(v || "#000000").slice(0, 7); w.addEventListener("input", function () { set(w.value.toUpperCase()); }); }
					else if (p.type === "combobox" && p.values) {
						w = el("select"); p.values.forEach(function (o) { var op = el("option", "", o.value); op.value = o.key; w.appendChild(op); }); w.value = v;
						w.addEventListener("change", function () { set(w.value); });
					} else {
						w = el("input"); w.value = v == null ? "" : v; w.spellcheck = false; w.autocomplete = "off";
						if (SECRET.test(k)) {
							// secret (clé d'API…) : masqué, jamais renvoyé en clair par le compagnon ; le toucher l'efface pour en saisir un nouveau
							w.type = "password";
							w.addEventListener("focus", function () { if (w.value === MASK) w.value = ""; });
							w.addEventListener("blur", function () { if (w.value === "" && v === MASK) { w.value = MASK; set(MASK); } });
						} else w.type = "text";
						w.addEventListener("input", function () { set(w.value); });
					}
					lab.appendChild(w); box.appendChild(lab);
					// à côté de l'accent : les couleurs proposées dans les maquettes
					if (k === "dotAccentColor") [["#10B981", "Émeraude"], ["#ED403B", "Rouge A"]].forEach(function (x) {
						var b = el("button", "preset"), i = el("i"); i.style.background = x[0]; b.type = "button";
						b.appendChild(i); b.appendChild(document.createTextNode(x[1]));
						b.addEventListener("click", function () { set(x[0]); draw(); });
						box.appendChild(b);
					});
				});
			}
			draw();
		});
	}
	// sous les réglages : valeurs par défaut du module, retirer la page (deux touchers)
	function barFor(card) {
		if (card.bar) card.bar.remove();
		var bar = el("div", "pagebar"); card.bar = bar; card.el.appendChild(bar);
		if (card.module) {
			var reset = el("button", "", "Valeurs par défaut"); reset.type = "button";
			reset.addEventListener("click", function () {
				// un secret enregistré est gardé (masque renvoyé tel quel)
				var keep = {}; Object.keys(card.settings).forEach(function (k) { if (SECRET.test(k) && card.settings[k] === MASK) keep[k] = MASK; });
				card.settings = keep; savePage(card); panelFor(card); pushPreview(card);
			});
			bar.appendChild(reset);
		}
		var del = el("button", "danger", "Retirer la page"); del.type = "button";
		del.addEventListener("click", function () {
			if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "Confirmer ?"; setTimeout(function () { delete del.dataset.sure; del.textContent = "Retirer la page"; }, 4000); return; }
			removeCard(card);
			if (card.id) fetch("/api/page/" + encodeURIComponent(card.id), { method: "DELETE" }).then(function (r) { flash(r.ok ? "Page retirée" : "Erreur"); }).catch(function () { flash("Erreur"); });
		});
		bar.appendChild(del);
	}
	function removeCard(card) {
		card.el.remove();
		PREVIEW.cards = PREVIEW.cards.filter(function (c) { return c !== card; });
		pushPages();
	}
	function lastScreen() { var cards = document.querySelectorAll(".card.preview"); return cards[cards.length - 1]; }
	function syncThemeCard() {
		document.querySelectorAll(".theme-card input[type=color]").forEach(function (w) { var k = w.getAttribute("data-key"); if (k && THEME[k]) w.value = String(THEME[k]).slice(0, 7); });
	}
	window.addEventListener("message", function (e) {
		var d = e.data || {};
		// « + » touché sur l'accueil : une page vide de plus, sous la dernière
		if (d.type === "dot-add") {
			var c = pageCard(null), last = lastScreen();
			last.insertAdjacentElement("afterend", c.el);
			c.el.scrollIntoView({ behavior: "smooth", block: "start" });
		}
		// module choisi dans une page vide : enregistré comme page, il tourne dans la carte, ses réglages dessous
		if (d.type === "dot-pick" && d.module) {
			PREVIEW.cards.forEach(function (card) {
				if (card.id || !card.frame || card.frame.contentWindow !== e.source) return;
				pending++;
				fetch("/api/pages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ module: d.module }) })
					.then(function (r) { return r.ok ? r.json() : null; })
					.then(function (pg) {
						pending--;
						if (!pg || !pg.id) { flash("Erreur"); return; }
						card.id = pg.id; card.module = pg.module; card.settings = Object.assign({}, pg.settings || {});
						frameFor(card); panelFor(card); barFor(card); pushPages();
						flash("Page ajoutée");
					})
					.catch(function () { pending--; flash("Erreur"); });
			});
		}
		// tuile d'une page touchée sur l'accueil : on descend à cette page
		if (d.type === "dot-goto") {
			var target = PREVIEW.cards.filter(function (c) { return c.id && c.id === d.page; })[0];
			if (target) target.el.scrollIntoView({ behavior: "smooth", block: "start" });
		}
	});
	// pages ajoutées ou retirées ailleurs (sur l'Edge, ou dans un autre onglet) : la page suit
	var pending = 0;
	function sync() {
		if (pending) return;
		fetch("/api/pages", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (list) {
			if (!list || pending) return;
			var ids = list.map(function (p) { return p.id; }), changed = false;
			PREVIEW.cards.slice().forEach(function (c) { if (c.id && ids.indexOf(c.id) < 0) { removeCard(c); changed = true; } });
			list.forEach(function (pg) {
				if (PREVIEW.cards.some(function (c) { return c.id === pg.id; })) return;
				// nouvelle page : après la dernière page enregistrée (les pages vides restent en dessous)
				var saved = PREVIEW.cards.filter(function (c) { return c.id || c.hub; }), after = saved[saved.length - 1];
				var c = pageCard(pg);
				after.el.insertAdjacentElement("afterend", c.el);
				// même ordre que les tuiles : la nouvelle carte suit la dernière enregistrée
				PREVIEW.cards.splice(PREVIEW.cards.indexOf(c), 1);
				PREVIEW.cards.splice(PREVIEW.cards.indexOf(after) + 1, 0, c);
				changed = true;
			});
			if (changed) pushPages();
		}).catch(function () {});
	}

	function load() {
		Promise.all([fetch("/api/modules").then(function (r) { return r.json(); }), fetch("/api/pages").then(function (r) { return r.json(); }), fetch("/api/theme").then(function (r) { return r.json(); })])
			.then(function (res) {
				MODULES = res[0];
				THEME_KEYS = ["dotAccentColor", "litDotColor", "unlitDotColor", "labelColor"].filter(function (k) { return k in res[2].defaults; });
				THEME = res[2].theme;
				var list = document.getElementById("list");
				list.innerHTML = "";
				list.appendChild(themeCard(res[2]));
				PREVIEW.cards = [];
				list.appendChild(hubCard());
				(res[1] || []).forEach(function (pg) { list.appendChild(pageCard(pg).el); });
			});
	}
	load();
	setInterval(sync, 3000);
})();
</script>
</body>
