<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dot Hub</title>
<!-- Iso à la maquette de référence widgets/dot-home/mockups/reference.html (mêmes tailles, mêmes valeurs) -->
<style>
@font-face { font-family: "Fira Code"; src: url("/m/clock/resources/fonts/FiraCode-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Fira Code"; src: url("/m/clock/resources/fonts/FiraCode-Medium.woff2") format("woff2"); font-weight: 500; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #080808; user-select: none; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #080808; --accent: #10b981; --lit: #f2f0e9; --label: #b8b6b0; --unlit: #1c1c1c; font-family: "Fira Code", Consolas, monospace; font-variant-ligatures: none; }
.stage button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stage button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.lbl { margin: 0; white-space: nowrap; font-size: 18px; line-height: 24px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.head { position: absolute; left: 56px; right: 56px; top: 30px; height: 60px; display: flex; align-items: center; gap: 14px; }
.stage.xl .head { top: 26px; }  /* libellé « ● DOT … » à 56 / 51 et 80 / 44, comme Dot Clock */
.head .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.head .grow { flex: 1; }
/* bouton SETTINGS : ouvre les réglages dans le navigateur du PC (zone tactile de 60 px) */
.head .set { display: flex; align-items: center; gap: 12px; margin: -18px -14px; padding: 18px 14px; border: 0; border-radius: 12px; background: transparent; color: var(--label); }
.head .set svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.head .set:active, .head .set.done { color: var(--accent); }

/* tuiles */
.tiles { position: absolute; left: 40px; right: 40px; top: 112px; bottom: 40px; display: grid; gap: 20px; }
.stage.xl .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
.stage.l .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
.stage.m .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 16px; top: 104px; }
.stage.s .head { display: none; }
.stage.s .tiles { top: 24px; bottom: 24px; left: 24px; right: 24px; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr; }
.tile { position: relative; display: grid; grid-template-rows: 1fr auto; gap: 14px; padding: 22px 24px; min-width: 0; min-height: 0; border: 2px solid #1d1d1d; border-radius: 18px; background: transparent; text-align: left; color: var(--lit); }
.tile:active, .tile.going { border-color: var(--accent); background: #0d0d0d; }
.tile .pic { display: grid; place-items: center; min-height: 0; }
.tile .pic canvas { display: block; }
.tile .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; }
.tile .name { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .pickbtn { margin: -18px -14px; padding: 18px 14px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; }
.head .pickbtn:active, .head .pickbtn[aria-expanded="true"] { color: var(--lit); }
.tile.add { display: grid; place-items: center; grid-template-rows: 1fr; border-style: dashed; border-color: #2a2a2a; color: var(--label); }
.tile.add .plus { font-size: 72px; line-height: 1; font-weight: 400; }
.tile .live { position: absolute; top: 18px; right: 22px; font-size: 18px; letter-spacing: .14em; color: var(--accent); }
.stage.m .tile { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr; align-items: center; gap: 18px; padding: 14px 20px; }
.stage.m .tile .meta { flex-direction: column; gap: 4px; }
.stage.m .tile .live { display: none; }
.stage.s .tile { padding: 16px; gap: 10px; }
.stage.s .tile .name { font-size: 20px; letter-spacing: .08em; }
.stage.s .tile .live { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
(function () {
	"use strict";
	// paramètres : dans l'adresse (?uid=…&preview=1), ou posés par la maquette de référence du compagnon
	var Q = window.__dotHubParams || {};
	new URLSearchParams(location.search).forEach(function (v, k) { if (!(k in Q)) Q[k] = v; });
	var uid = Q.uid || "", preview = Q.preview === "1" || Q.preview === true, blank = Q.blank === "1" || Q.blank === true;
	var stage = document.getElementById("stage");
	var SLOTS = { s: [840, 344], m: [840, 696], l: [1688, 696], xl: [2536, 696] };
	var PITCH = { xl: 19, l: 13, m: 9, s: 12 };
	var LIT = "#f2f0e9", UNLIT = "#1c1c1c";
	// même détection que widgets/dot-clock/scripts/sizes.js (rapport largeur / hauteur)
	function classify(w, h) {
		var r = w / h;
		if (r >= 2.98) return "xl";
		if (r >= 2.02) return h >= 489 ? "l" : "s";
		return "m";
	}
	// pictogrammes 7 × 7 points, ceux de la maquette Dot Home
	var PICS = {
		clock: [".#####.", "#..#..#", "#..#..#", "#..###.", "#.....#", "#.....#", ".#####."],
		steam: ["###.###", "###.###", "###.###", ".......", "###.###", "###.###", "###.###"],
		home: ["...#...", "..###..", ".#####.", "#######", ".#...#.", ".#.#.#.", ".#####."]
	};
	function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
	function pic(key, pitch) {
		var g = PICS[key] || PICS.home, cv = document.createElement("canvas"), dpr = 2, w = 7 * pitch, r = pitch * 0.38;
		cv.width = w * dpr; cv.height = w * dpr; cv.style.width = w + "px"; cv.style.height = w + "px";
		var ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
			ctx.beginPath(); ctx.fillStyle = g[y][x] === "#" ? LIT : UNLIT;
			ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, r, 0, Math.PI * 2); ctx.fill();
		}
		return cv;
	}
	function live(id) {
		if (id === "clock") { var d = new Date(); return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes(); }
		return "";
	}

	var modules = [], inst = {}, picking = false;
	function render() {
		var size = classify(window.innerWidth || 2536, window.innerHeight || 696), dims = SLOTS[size];
		var W = dims[0], H = dims[1], scale = Math.min(window.innerWidth / W, window.innerHeight / H) || 1;
		stage.className = "stage " + size;
		stage.style.width = W + "px"; stage.style.height = H + "px";
		stage.style.transform = "translate(" + (window.innerWidth - W * scale) / 2 + "px," + (window.innerHeight - H * scale) / 2 + "px) scale(" + scale + ")";
		stage.innerHTML = "";

		var head = el("div", "head");
		head.appendChild(el("span", "dot"));
		// aperçu vide (carte ajoutée par le « + ») : « ● DOT » seulement ; le toucher affiche les modules à choisir
		if (blank) {
			var pick = el("button", "lbl pickbtn", picking ? "DOT ▴" : "DOT ▾"); pick.type = "button";
			pick.setAttribute("aria-label", "Choose a module"); pick.setAttribute("aria-expanded", picking ? "true" : "false");
			pick.addEventListener("click", function () { picking = !picking; render(); });
			head.appendChild(pick);
		} else head.appendChild(el("p", "lbl", "DOT HUB" + (inst.name ? " · " + inst.name : "")));
		head.appendChild(el("span", "grow"));
		if (!preview) head.appendChild(settingsButton()); // dans la page de réglages, SETTINGS ne sert à rien
		stage.appendChild(head);
		if (blank && !picking) return;

		var grid = el("div", "tiles");
		// aperçu de la page de réglages : pas de module, une carte vide « + » pour en ajouter un (proposition)
		if (preview && !blank) {
			var add = el("button", "tile add"); add.type = "button"; add.setAttribute("aria-label", "Add a module");
			add.appendChild(el("span", "plus", "+"));
			add.addEventListener("click", function () { if (window.parent !== window) window.parent.postMessage({ type: "dot-add" }, "*"); });
			grid.appendChild(add); stage.appendChild(grid);
			return;
		}
		modules.forEach(function (m) {
			var b = el("button", "tile"); b.type = "button";
			b.setAttribute("aria-label", "Open " + m.name);
			var p = el("div", "pic"); p.appendChild(pic(m.id, PITCH[size])); b.appendChild(p);
			var meta = el("div", "meta"); meta.appendChild(el("span", "name", m.name)); b.appendChild(meta);
			var lv = live(m.id); if (lv) b.appendChild(el("span", "live", lv));
			b.addEventListener("click", function () {
				// aperçu vide : le module choisi s'affiche dans la carte de la page de réglages
				if (blank) { if (window.parent !== window) window.parent.postMessage({ type: "dot-pick", module: m.id }, "*"); return; }
				choose(m.id, b);
			});
			grid.appendChild(b);
		});
		stage.appendChild(grid);
	}
	// SETTINGS : le compagnon ouvre http://127.0.0.1:47800/settings dans le navigateur du PC
	var GEAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>';
	function settingsButton() {
		var b = el("button", "set"); b.type = "button";
		b.setAttribute("aria-label", "Open Dot Hub settings on the PC");
		b.innerHTML = GEAR;
		var t = el("span", "lbl", "SETTINGS"); t.style.color = "inherit"; b.appendChild(t);
		b.addEventListener("click", function () {
			if (preview) return;
			fetch("/api/open-settings", { method: "POST" }).then(function (r) { return r.json(); }).then(function (j) {
				b.classList.add("done"); t.textContent = j && j.ok ? "OPENED ON THE PC" : "CANNOT OPEN BROWSER";
				setTimeout(function () { b.classList.remove("done"); t.textContent = "SETTINGS"; }, 3000);
			}).catch(function () {});
		});
		return b;
	}
	function choose(id, b) {
		if (preview) return; // aperçu dans la page de réglages : le module se choisit dans la carte du Dot Hub
		b.classList.add("going");
		fetch("/api/instance/" + encodeURIComponent(uid), {
			method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ module: id })
		}).then(function () { location.href = "/i/" + encodeURIComponent(uid); });
	}
	Promise.all([
		fetch("/api/modules").then(function (r) { return r.json(); }),
		fetch("/api/instance/" + encodeURIComponent(uid)).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
	]).then(function (res) { modules = res[0]; inst = res[1] || {}; applyTheme(inst.theme); render(); });
	// couleurs communes réglées dans la carte « Couleurs » de la page de réglages
	function applyTheme(t) {
		if (!t) return;
		if (t.dotAccentColor) stage.style.setProperty("--accent", t.dotAccentColor);
		if (t.litDotColor) stage.style.setProperty("--lit", t.litDotColor);
		if (t.labelColor) stage.style.setProperty("--label", t.labelColor);
		LIT = t.litDotColor || LIT; UNLIT = t.unlitDotColor || UNLIT;
	}
	// aperçu : couleurs reçues tout de suite de la page de réglages
	window.addEventListener("message", function (e) { var d = e.data || {}; if (preview && d.type === "dot-preview" && d.theme) { applyTheme(d.theme); render(); } });
	window.addEventListener("resize", render);
	setInterval(render, 30000);
	if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
