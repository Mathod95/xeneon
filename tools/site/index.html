/* Layout : en-tête MATHOD (FR / EN), titre en gros points, chiffres clés, Dot Hub (le projet), la Xeneon Edge simulée, puis une carte par module. Un seul thème sombre, celui des widgets. */
:root {
  --bg: #080808;
  --panel: #0e0e0e;
  --line: #1f1f1f;
  --lit: #f2f0e9;
  --label: #b8b6b0;
  --muted: #7d7b76;
  --unlit: #1c1c1c;
  --accent: #10b981;
  --wip: #f5b942;
  --spec: #a78bfa;
  --design: #5aa9e6;
  --idea: #6b6b6b;
  --mono: "Fira Code", "Cascadia Mono", Consolas, monospace;
  --brand: "Segoe UI", Selawik, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--lit);
  font-family: var(--brand); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px);
  background-size: 22px 22px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 48px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* en-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .22em; font-size: 15px; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.ext { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); text-decoration: none; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.ext:hover { color: var(--lit); border-color: #333; }
.topr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.lang .chip { padding: 6px 12px; border: 0; }

/* Dot Hub : ce qu'est le projet */
.hubsec { display: grid; gap: 22px; padding: clamp(20px, 3vw, 32px); border: 1px solid #262626; border-radius: 20px; background: var(--panel); }
.hub-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hub-head .id { display: flex; align-items: center; gap: 18px; }
.hub-head canvas { display: block; width: 64px; height: 64px; }
.hub-head h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: .14em; text-transform: uppercase; }
.hub-lead { margin: 0; font-size: clamp(16px, 1.6vw, 19px); color: var(--lit); text-wrap: pretty; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; color: var(--label); font-size: 15px; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--mono); font-weight: 500; font-size: 14px; }
.steps b { color: var(--lit); font-weight: 600; }
.hub-k { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.part { display: grid; gap: 10px; align-content: start; padding: 20px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.part .ph2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.part h3 { margin: 0; font-size: 18px; font-weight: 700; }
.part .tag2 { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.part p { margin: 0; color: var(--label); font-size: 15px; }
.part .more { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
.part .more:hover { color: var(--lit); }
.daily { margin: 0; color: var(--label); font-size: 15px; }
.daily b { color: var(--lit); font-weight: 600; }
.hub-links { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; flex-wrap: wrap; }

/* titre */
.hero { display: grid; gap: 22px; }
.hero canvas { display: block; width: 100%; max-width: 760px; height: auto; justify-self: center; }
.tagline { font-family: var(--mono); font-size: clamp(17px, 2.2vw, 24px); margin: 0; color: var(--lit); text-wrap: balance; }
.tagline i { font-style: normal; color: var(--accent); padding: 0 .5em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.stats b { color: var(--accent); font-weight: 500; font-size: 18px; margin-right: .5em; font-variant-numeric: tabular-nums; }

/* filtres */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.bar h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--lit); border-color: var(--lit); color: var(--bg); }

/* cartes */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; padding: 22px; min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.card.has { border-color: #262626; }
.card.has:hover { border-color: var(--accent); }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.card canvas { display: block; flex: none; width: 70px; height: 70px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idea)); }
.card h3 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.card p { margin: 0; color: var(--label); font-size: 15px; min-width: 0; }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.links { display: flex; gap: 16px; }
.links a { text-decoration: none; color: var(--label); }
.links a:hover { color: var(--lit); }
.links a.mock { color: var(--accent); }
.empty { color: var(--muted); }
.none { color: var(--label); font-family: var(--mono); }

/* la Xeneon Edge : l'accueil de Dot Hub (iso à companion/web/home.html en XL), puis une page par module */
.edge-sec { display: grid; gap: 16px; }
.hint { margin: 0; color: var(--label); font-size: 14px; }
.edge { padding: clamp(6px, 1.2%, 18px); border-radius: clamp(10px, 1.6vw, 24px); background: linear-gradient(180deg, #161616, #0b0b0b); border: 1px solid #2a2a2a; box-shadow: 0 40px 80px -40px #000, inset 0 1px 0 #262626; }
.screen { position: relative; aspect-ratio: 2560 / 720; max-width: 100%; overflow: hidden; border-radius: clamp(3px, .5vw, 8px); background: #000; touch-action: pan-y; cursor: grab; user-select: none; }
.native { position: absolute; left: 0; top: 0; width: 2560px; height: 720px; transform-origin: 0 0; }
.strip { position: absolute; left: 0; top: 0; height: 720px; display: flex; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
@media (prefers-reduced-motion: reduce) { .strip { transition: none; } }
.pg { position: relative; width: 2560px; height: 720px; flex: none; }
.slot { position: absolute; left: 12px; top: 12px; width: 2536px; height: 696px; background: #080808; border-radius: 12px; overflow: hidden; font-family: var(--mono); font-variant-ligatures: none; color: var(--lit); }
.slot img { display: block; width: 2536px; height: 696px; -webkit-user-drag: none; }
.slot .lbl { margin: 0; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.dh-head { position: absolute; left: 56px; right: 56px; top: 26px; height: 60px; display: flex; align-items: center; gap: 14px; }
.dh-head::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dh-head .grow { flex: 1; }
.dh-head .set { display: flex; align-items: center; gap: 12px; }
.dh-head .set svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.dh-tiles { position: absolute; left: 40px; right: 40px; top: 112px; bottom: 40px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 20px; }
.dh-tile { position: relative; display: grid; grid-template-rows: 1fr auto; gap: 14px; padding: 22px 24px; min-width: 0; min-height: 0; border: 2px solid #1d1d1d; border-radius: 18px; background: transparent; color: var(--lit); text-align: left; font-family: inherit; cursor: pointer; }
.dh-tile:hover, .dh-tile:focus-visible { border-color: var(--accent); background: #0d0d0d; outline: none; }
.dh-tile .pic { display: grid; place-items: center; min-height: 0; }
.dh-tile .pic canvas { width: 133px; height: 133px; }
.dh-tile .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dh-tile .name { font-size: 24px; letter-spacing: .12em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh-tile .live { position: absolute; top: 18px; right: 22px; font-size: 18px; letter-spacing: .14em; color: var(--accent); }
.dh-tile.more { place-items: center; grid-template-rows: 1fr; border-style: dashed; color: var(--label); font-size: 22px; letter-spacing: .2em; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 30px; text-decoration: none; color: var(--lit); }
.ph canvas { width: 280px; height: 280px; }
.ph .lbl { font-size: 24px; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.dots { display: flex; flex-wrap: wrap; gap: 2px; }
.dots button { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; cursor: pointer; }
.dots button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #2a2a2a; }
.dots button[aria-current="true"]::before { background: var(--lit); }
.dots button:hover::before { background: var(--label); }
.where { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--label); }
.where a { color: var(--accent); text-decoration: none; }
.nav { display: flex; gap: 8px; }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-family: var(--mono); font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
footer .red { color: var(--accent); }
footer a { color: var(--label); text-decoration: none; }
</style>

    var m = /\(([^)]*)\)/.exec(w.status);
    return t("kind")[w.kind] + (m ? " (" + m[1] + ")" : "");
  }

  // police 5 × 7 points pour le titre
  var F = {
    D: ["####.", "#...#", "#...#", "#...#", "#...#", "#...#", "####."],
    O: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
    T: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."],
    W: ["#...#", "#...#", "#...#", "#.#.#", "#.#.#", "##.##", "#...#"],
    I: ["###", ".#.", ".#.", ".#.", ".#.", ".#.", "###"],
    G: [".###.", "#...#", "#....", "#.###", "#...#", "#...#", ".####"],
    E: ["#####", "#....", "#....", "####.", "#....", "#....", "#####"],
    S: [".####", "#....", "#....", ".###.", "....#", "....#", "####."],
    H: ["#...#", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
    U: ["#...#", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
    B: ["####.", "#...#", "#...#", "####.", "#...#", "#...#", "####."],
    " ": ["..", "..", "..", "..", "..", "..", ".."]
  };
  // titre en points ; le dernier mot (HUB) est en points éteints sur un fond de points allumés en couleur d'accent
  function drawTitle(text) {
    var cv = document.getElementById("titleDots"), ctx = cv.getContext("2d");
    var cols = [], lastWordCol = 0;
    text.split("").forEach(function (ch, i) {
      if (ch === " ") lastWordCol = cols.length + F[" "][0].length;
      var g = F[ch];
      for (var c = 0; c < g[0].length; c++) cols.push(g.map(function (r) { return r[c] === "#"; }));
      if (i < text.length - 1) cols.push([false, false, false, false, false, false, false]);
    });
    var pad = 1, total = cols.length + pad * 2, rows = 7 + pad * 2;
    var accentFrom = lastWordCol + pad;          // une colonne de fond avant la première lettre du dernier mot
    var pitch = cv.width / total, r = pitch * 0.36;
    cv.height = Math.round(rows * pitch);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var x = 0; x < total; x++) for (var y = 0; y < rows; y++) {
      var col = cols[x - pad], on = col && y >= pad && y < 7 + pad && col[y - pad];
      var inWord = x >= accentFrom, accent = inWord && !on, lit = on && !inWord;
      ctx.beginPath();
      ctx.fillStyle = lit ? "#f2f0e9" : accent ? "#10b981" : "#171717";
      ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, lit || accent ? r : r * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // pictogrammes 7 × 7 points, un par widget
  var PICS = {
    "dot-system-monitor": ["......#", ".....##", "....###", "...####", "..#####", ".######", "#######"],
    "dot-audio": ["...#...", "..##.#.", "####..#", "####..#", "####..#", "..##.#.", "...#..."],
    "dot-calendar": ["#######", "#.....#", "#######", "#.#.#.#", "#######", "#.#.#.#", "#######"],
    "dot-steam": ["###.###", "###.###", "###.###", ".......", "###.###", "###.###", "###.###"],
    "dot-spotify": ["..#####", "..#...#", "..#...#", "..#...#", "###..##", "###.###", "###.###"],
    "dot-clock": [".#####.", "#..#..#", "#..#..#", "#..###.", "#.....#", "#.....#", ".#####."],
    "dot-bambulab": ["#######", "#.....#", "#.###.#", "#..#..#", "#.....#", "#.###.#", "#######"],
    "dot-discord": [".#####.", "#.....#", "#.#.#.#", "#.....#", ".#####.", "..#....", ".#....."],
    "dot-homeassistant": ["...#...", "..#.#..", ".#...#.", "#..#..#", ".#.#.#.", ".#...#.", ".#####."],
    "dot-weather": ["#..#..#", ".#...#.", "..###..", "#.###.#", "..###..", ".#...#.", "#..#..#"],
    "dot-fans": ["..###..", ".#.#.#.", "#..#..#", "#######", "#..#..#", ".#.#.#.", "..###.."],
    "dot-apps": ["#.#.#.#", ".......", "#.#.#.#", ".......", "#.#.#.#", ".......", "#.#.#.#"],
    "dot-battery": [".......", "######.", "####..#", "####..#", "######.", ".......", "......."],
    "dot-network": ["......#", "....#.#", "....#.#", "..#.#.#", "..#.#.#", "#.#.#.#", "#.#.#.#"],
    "dot-slack": ["..#.#..", "#######", "..#.#..", "..#.#..", "#######", "..#.#..", "..#.#.."],
    "dot-gmail": ["#######", "##...##", "#.#.#.#", "#..#..#", "#.....#", "#.....#", "#######"],
    "dot-argocd": ["..###.#", ".#...##", "#...###", "#.....#", "###...#", "##...#.", "#.###.."],
    "dot-seerr": ["#.#.#.#", "#######", "#.....#", "#.....#", "#.....#", "#######", "#.#.#.#"],
    "dot-proxmox": ["#######", "#..#.##", "#######", "#######", "#..#.##", "#######", "..#.#.."],
    "dot-kubernetes": ["###.###", "#.#.#.#", "###.###", "...#...", "..###..", "..#.#..", "..###.."],
    "dot-qbittorrent": ["...#...", "...#...", "...#...", "#..#..#", ".#.#.#.", "..###..", "#######"],
    "dot-portainer": ["#######", "#.#.#.#", "#.#.#.#", "#.#.#.#", "#.#.#.#", "#######", "......."],
    "dot-radarr": [".#####.", "##.#.##", "#.....#", "###.###", "#.....#", "##.#.##", ".#####."],
    "dot-sonarr": [".#...#.", "..#.#..", "#######", "#.....#", "#.....#", "#######", ".#...#."],
    "dot-notes": ["##.####", ".......", "##.####", ".......", "##.####", ".......", "##.###."],
    "dot-plex": [".##....", "..##...", "...##..", "....##.", "...##..", "..##...", ".##...."],
    "dot-ia": ["...#...", "...#...", "#..#..#", ".#####.", "#..#..#", "...#...", "...#..."],
    "dot-home": ["...#...", "..###..", ".#####.", "#######", ".#...#.", ".#.#.#.", ".#####."],
    "dot-github": ["#...#..", "#...#..", "#..#...", "#.#....", "##.....", "#......", "#......"],
    "dot-hub": ["###.###", "#.#.#.#", "###.###", ".......", "###.###", "#.#.#.#", "###.###"],
    "dot-calculator": [".#...#.", "###.###", ".#.....", ".......", "#.#.###", ".#.....", "#.#.###"]
  };
  var BLANK = [".......", ".......", "...#...", "..###..", "...#...", ".......", "......."];
  function pic(slug, color) {
    var g = PICS[slug] || BLANK, cv = document.createElement("canvas"), px = 140, p = px / 7, r = p * 0.36;
    cv.width = px; cv.height = px;
    var ctx = cv.getContext("2d");
    for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
      ctx.beginPath(); ctx.fillStyle = g[y][x] === "#" ? color : "#1c1c1c";
      ctx.arc(x * p + p / 2, y * p + p / 2, r, 0, Math.PI * 2); ctx.fill();
    }
    cv.setAttribute("aria-hidden", "true");
    return cv;
  }

  var KIND = { wip: "var(--wip)", spec: "var(--spec)", design: "var(--design)", idea: "var(--idea)" };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function stats() {
    var ul = document.getElementById("stats"); ul.innerHTML = "";
    [[WIDGETS.length, t("sModules")], [WIDGETS.filter(function (w) { return w.mockup; }).length, t("sMock")], [WIDGETS.filter(function (w) { return w.kind === "wip"; }).length, t("sWip")]].forEach(function (s) {
      var li = el("li"); li.appendChild(el("b", "", String(s[0]))); li.appendChild(document.createTextNode(s[1])); ul.appendChild(li);
    });
  }

  var filter = "all";
  function render() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var list = WIDGETS.filter(function (w) {
      return filter === "all" || (filter === "mock" && w.mockup) || (filter === "wip" && w.kind === "wip");
    });
    list.forEach(function (w) {
      var card = el("article", "card" + (w.mockup ? " has" : ""));
      var row = el("div", "row");
      var cv = pic(w.slug, w.mockup ? "#f2f0e9" : "#5f5d58");
      row.appendChild(cv);
      var st = el("span", "status", statusText(w)); st.style.setProperty("--c", KIND[w.kind] || KIND.idea);
      row.appendChild(st);
      card.appendChild(row);
      card.appendChild(el("h3", "", w.name));
      card.appendChild(el("p", "", desc(w)));
      var foot = el("div", "foot");
      var links = el("span", "links");
      if (w.mockup) {
        var a = el("a", "mock", t("mockup")); a.href = BASE + w.slug + "/"; links.appendChild(a);
        card.addEventListener("mouseenter", function () { row.replaceChild(pic(w.slug, "#10b981"), row.firstChild); });
        card.addEventListener("mouseleave", function () { row.replaceChild(pic(w.slug, "#f2f0e9"), row.firstChild); });
      }
      var f = el("a", "", t("fiche")); f.href = REPO + w.slug; f.target = "_blank"; f.rel = "noopener"; links.appendChild(f);
      foot.appendChild(links);
      card.appendChild(foot);
      grid.appendChild(card);
    });
    document.getElementById("none").hidden = list.length > 0;
  }
  document.querySelectorAll(".chip[data-f]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-f");
      document.querySelectorAll(".chip[data-f]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      render();
    });
  });


  // ---------- la Xeneon Edge
  var SHOTS = JSON.parse(document.getElementById("previews").textContent);
  var PAGES = WIDGETS.filter(function (w) { return w.mockup && w.slug !== "dot-home" && w.slug !== "dot-hub"; });
  var cur = 0, strip = document.getElementById("strip"), screen = document.getElementById("screen"), native = document.getElementById("native");
  function fitEdge() { native.style.transform = "scale(" + screen.clientWidth / 2560 + ")"; }
  if (window.ResizeObserver) new ResizeObserver(fitEdge).observe(screen); else window.addEventListener("resize", fitEdge);
  function buildEdge() {
    var home = el("div", "pg"), slot = el("div", "slot");
    var hd = el("div", "dh-head");
    hd.appendChild(el("p", "lbl", "DOT HUB")); hd.appendChild(el("span", "grow")); var st = el("p", "lbl set"); st.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>SETTINGS'; hd.appendChild(st);
    slot.appendChild(hd);
    var tiles = el("div", "dh-tiles");
    PAGES.slice(0, 9).forEach(function (w, i) {
      var b = el("button", "dh-tile"); b.type = "button"; b.setAttribute("aria-label", "Open " + w.name);
      var pc = el("div", "pic"); pc.appendChild(pic(w.slug, "#f2f0e9")); b.appendChild(pc);
      var meta = el("div", "meta"); meta.appendChild(el("span", "name", w.name)); b.appendChild(meta);
      if (w.slug === "dot-clock") { var d0 = new Date(); b.appendChild(el("span", "live", (d0.getHours() < 10 ? "0" : "") + d0.getHours() + ":" + (d0.getMinutes() < 10 ? "0" : "") + d0.getMinutes())); }
      b.addEventListener("click", function () { if (!dragged) go(i + 1); });
      tiles.appendChild(b);
    });
    var more = el("button", "dh-tile more", "ALL MODULES ↓"); more.type = "button";
    more.addEventListener("click", function () { if (!dragged) document.getElementById("list").scrollIntoView({ behavior: "smooth" }); });
    tiles.appendChild(more);
    slot.appendChild(tiles);
    home.appendChild(slot);
    strip.appendChild(home);
    PAGES.forEach(function (w) {
      var pg = el("div", "pg"), sl = el("div", "slot");
      if (SHOTS[w.slug]) {
        var img = el("img"); img.src = SHOTS[w.slug]; img.alt = w.name + t("alt"); img.draggable = false;
        sl.appendChild(img);
      } else {
        var a = el("a", "ph"); a.href = BASE + w.slug + "/";
        a.appendChild(pic(w.slug, "#f2f0e9")); a.appendChild(el("p", "lbl", w.name + t("openMock")));
        sl.appendChild(a);
      }
      pg.appendChild(sl); strip.appendChild(pg);
    });
    var dots = document.getElementById("dots");
    for (var i = 0; i <= PAGES.length; i++) (function (i) {
      var d = el("button"); d.type = "button"; d.setAttribute("aria-label", "Page " + (i + 1));
      d.addEventListener("click", function () { go(i); });
      dots.appendChild(d);
    })(i);
  }
  function go(i) {
    cur = Math.max(0, Math.min(PAGES.length, i));
    strip.style.transform = "translateX(" + (-cur * 2560) + "px)";
    document.querySelectorAll("#dots button").forEach(function (d, k) { d.setAttribute("aria-current", k === cur ? "true" : "false"); });
    var w = PAGES[cur - 1];
    document.getElementById("where").textContent = "Page " + (cur + 1) + " · " + (w ? w.name : "Dot Hub");
    var open = document.getElementById("open");
    open.hidden = !w; if (w) open.href = BASE + w.slug + "/";
  }
  // glisser pour changer de page
  var x0 = null, dragged = false;
  screen.addEventListener("pointerdown", function (e) { x0 = e.clientX; dragged = false; });
  screen.addEventListener("pointermove", function (e) { if (x0 !== null && Math.abs(e.clientX - x0) > 12) dragged = true; });
  window.addEventListener("pointerup", function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
    setTimeout(function () { dragged = false; }, 0);
  });
  document.getElementById("prev").addEventListener("click", function () { go(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { go(cur + 1); });
  document.getElementById("homeBtn").addEventListener("click", function () { go(0); });
  // ---------- Dot Hub
  function renderHub() {
    var c = document.getElementById("hubPic"), ctx = c.getContext("2d"), g = PICS["dot-hub"], p = 20;
    ctx.clearRect(0, 0, 140, 140);
    for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) { ctx.beginPath(); ctx.fillStyle = g[y][x] === "#" ? "#10b981" : "#1c1c1c"; ctx.arc(x * p + p / 2, y * p + p / 2, p * .36, 0, 7); ctx.fill(); }
    if (!HUB) return;
    var st = document.getElementById("hubStatus"); st.textContent = statusText(HUB); st.style.setProperty("--c", KIND[HUB.kind] || KIND.idea);
    var m = document.getElementById("hubMock"); m.hidden = !HUB.mockup; m.href = BASE + "dot-hub/";
    document.getElementById("hubFiche").href = REPO + "dot-hub";
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (e) { e.textContent = t(e.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (e) { e.innerHTML = t(e.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-label]").forEach(function (e) { e.setAttribute("aria-label", t(e.getAttribute("data-i18n-label"))); });
    document.querySelectorAll(".lang .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    stats(); render(); renderHub();
    strip.innerHTML = ""; document.getElementById("dots").innerHTML = "";
    buildEdge(); go(cur);
  }
  document.querySelectorAll(".lang .chip").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("dotpage-lang", lang); } catch (e) {}
      applyLang();
    });
  });

  drawTitle("DOT HUB");
  applyLang(); fitEdge();
})();
</script>
