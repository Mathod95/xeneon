/* Layout : même en-tête que Dot Page, titre COMPANION en points, puis ce qu'il fait, l'installation, ce qu'il utilise module par module, la confidentialité et la suite. Un seul thème sombre. */
:root {
  --bg: #080808;
  --panel: #0e0e0e;
  --line: #1f1f1f;

  --accent: #10b981;
  --wip: #f5b942;
  --mono: "Fira Code", "Cascadia Mono", Consolas, monospace;
  --brand: "Segoe UI", Selawik, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--lit);
  font-family: var(--brand); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px);
  background-size: 22px 22px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 48px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* en-tête (identique à Dot Page) */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .22em; font-size: 15px; text-decoration: none; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.topr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.ext { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); text-decoration: none; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.ext:hover { color: var(--lit); border-color: #333; }
.ext[aria-current="page"] { color: var(--bg); background: var(--lit); border-color: var(--lit); }
.lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--bg); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--lit); color: var(--bg); }

/* titre */
.hero { display: grid; gap: 20px; }
.hero canvas { display: block; width: 100%; max-width: 760px; height: auto; justify-self: start; }
.lede { margin: 0; font-family: var(--mono); font-size: clamp(15px, 1.8vw, 19px); color: var(--lit); text-wrap: balance; max-width: 70ch; }
.lede i { font-style: normal; color: var(--accent); padding: 0 .5em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--label); }
.facts b { color: var(--accent); font-weight: 500; margin-right: .5em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.btn { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--label); background: var(--bg); }
.btn:hover { color: var(--lit); border-color: #333; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.main:hover { color: var(--bg); filter: brightness(1.1); }

/* sections */
.sec { display: grid; gap: 18px; }
.sec > h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 14px; }
.card { display: grid; gap: 12px; align-content: start; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); min-width: 0; }
.card canvas { display: block; width: 56px; height: 56px; }
.card h3 { margin: 0; font-size: 19px; font-weight: 700; }
.card p { margin: 0; color: var(--label); font-size: 15px; }
code { font-family: var(--mono); font-size: .88em; color: var(--lit); background: #161616; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }

.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--label); font-size: 15px; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--mono); font-weight: 500; font-size: 14px; }
.steps b { color: var(--lit); font-weight: 600; }
.note { margin: 0; padding: 16px 20px; border: 1px solid #2a2414; border-radius: 14px; background: #0f0d08; color: var(--label); font-size: 15px; }
.note b { color: var(--wip); font-weight: 600; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { text-align: left; padding: 14px 18px; vertical-align: top; border-bottom: 1px solid var(--line); font-size: 15px; }
tr:last-child td { border-bottom: 0; }
thead th { font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; white-space: nowrap; }
td { color: var(--label); }
td .tagw { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--wip); }

.list { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; color: var(--label); }
.list li::marker { color: #3a3a3a; }
.list b { color: var(--lit); font-weight: 600; }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-family: var(--mono); font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
footer .red { color: var(--accent); }
footer a { color: var(--label); text-decoration: none; }
</style>

      w3t: "It does what a widget cannot", w3: "An iCUE widget cannot see your PC. The companion can: it reads Steam files, launches games, and later will control the Windows sound or talk to Discord, Plex and Home Assistant.",
      w4t: "It keeps your secrets", w4: "API keys and tokens are encrypted on the PC with Windows protection (DPAPI), masked in the settings page and never sent back in clear.",
      installK: "Install",
      s1: "<b>Download</b> <code>dot-companion.exe</code> from the latest release.",
      s2: "<b>Run it</b>: a small window says it is ready. Keep it open.",
      s3: "<b>Add Dot Hub</b> to your Edge in iCUE (the <code>.icuewidget</code> file from the same release).",

      thModule: "Module", thUses: "On the PC", thNet: "On the Internet",
      clockUses: "The PC time and time zone.", clockNet: "Nothing.",

      privK: "Privacy",

  // titre COMPANION en points (police 5 × 7 de Dot Page)

    C: [".####", "#....", "#....", "#....", "#....", "#....", ".####"],
    O: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
    M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"],
    P: ["####.", "#...#", "#...#", "####.", "#....", "#....", "#...."],
    A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
    N: ["#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#", "#...#"],
    I: ["###", ".#.", ".#.", ".#.", ".#.", ".#.", "###"]
  };
  function drawTitle(text) {
    var cv = document.getElementById("titleDots"), ctx = cv.getContext("2d"), cols = [];
    text.split("").forEach(function (ch, i) {
      var g = F[ch];
      for (var c = 0; c < g[0].length; c++) cols.push(g.map(function (r) { return r[c] === "#"; }));
      if (i < text.length - 1) cols.push([false, false, false, false, false, false, false]);
    });
    var pad = 1, total = cols.length + pad * 2, rows = 7 + pad * 2, pitch = cv.width / total, r = pitch * 0.36;
    cv.height = Math.round(rows * pitch);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var x = 0; x < total; x++) for (var y = 0; y < rows; y++) {
      var col = cols[x - pad], on = col && y >= pad && y < 7 + pad && col[y - pad];
      ctx.beginPath(); ctx.fillStyle = on ? "#f2f0e9" : "#171717";
      ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, on ? r : r * 0.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  // pictogrammes 7 × 7 des cartes
  var PICS = {
    serve: ["#######", "#.....#", "#.###.#", "#.....#", "#######", "...#...", ".#####."],
    settings: ["...#...", ".#.#.#.", "..###..", "###.###", "..###..", ".#.#.#.", "...#..."],
    power: ["....##.", "...##..", "..##...", ".#####.", "...##..", "..##...", ".##...."],
    lock: ["..###..", ".#...#.", ".#...#.", "#######", "###.###", "###.###", "#######"]
  };
  function drawPics() {
    document.querySelectorAll("canvas[data-pic]").forEach(function (cv) {
      var g = PICS[cv.getAttribute("data-pic")], ctx = cv.getContext("2d"), p = cv.width / 7;
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
        ctx.beginPath(); ctx.fillStyle = g[y][x] === "#" ? "#10b981" : "#1c1c1c";

  }
  document.querySelectorAll(".lang .chip").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem("dotpage-lang", lang); } catch (e) {} render(); });
  });

  drawTitle("COMPANION");
  drawPics();
  render();
})();
</script>
