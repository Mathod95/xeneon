<style>
/* Layout : même en-tête que Dot Page, titre COMPANION en points, puis ce qu'il fait, l'installation, ce qu'il utilise module par module, la confidentialité et la suite. Un seul thème sombre. */
:root {
  --bg: #080808;
  --panel: #0e0e0e;
  --line: #1f1f1f;
  --lit: #f2f0e9;
  --label: #b8b6b0;
  --muted: #7d7b76;
  --accent: #10b981;
  --wip: #f5b942;
  --mono: "Fira Code", "Cascadia Mono", Consolas, monospace;
  --brand: "Segoe UI", Selawik, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--lit);
  font-family: var(--brand); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px);
  background-size: 22px 22px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 48px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* en-tête (identique à Dot Page) */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; height: 42px; font-weight: 700; letter-spacing: .22em; font-size: 15px; color: var(--lit); text-decoration: none; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.topr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.ext { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); text-decoration: none; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.ext:hover { color: var(--lit); border-color: #333; }
.ext[aria-current="page"] { color: var(--bg); background: var(--lit); border-color: var(--lit); }
.lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--bg); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--lit); color: var(--bg); }

/* titre */
.hero { display: grid; gap: 20px; }
.hero canvas { display: block; max-width: min(100%, 760px); height: auto; justify-self: start; }
.lede { margin: 0; font-family: var(--mono); font-size: clamp(15px, 1.8vw, 19px); color: var(--lit); text-wrap: balance; }
.lede i { font-style: normal; color: var(--accent); padding: 0 .5em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--label); }
.facts b { color: var(--accent); font-weight: 500; margin-right: .5em; }
.cta { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.btn { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--label); background: var(--bg); }
.btn:hover { color: var(--lit); border-color: #333; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.main:hover { color: var(--bg); filter: brightness(1.1); }

/* sections */
.sec { display: grid; gap: 18px; }
.sec > h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
/* .about : le même bloc que Dot Hub sur Dot Page (haut comme une carte, sur-titres, parties, étapes) */
.about { display: grid; gap: 22px; padding: clamp(20px, 3vw, 32px); border: 1px solid #262626; border-radius: 20px; background: var(--panel); }
.about-head { display: flex; align-items: stretch; gap: 16px; }
.about-head canvas { display: block; flex: none; width: 70px; height: 70px; }
.about-head .head { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; flex: 1; height: 70px; }
.about-head h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.ver { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.about-k { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
/* les parties en 2 × 2 : pictogramme à gauche, titre en haut, texte dessous qui passe sous le pictogramme */
.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.part { padding: 20px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.part canvas { display: block; float: left; width: 70px; height: 70px; margin: 0 16px 6px 0; }
.part h3 { margin: -3px 0 8px; font-size: 18px; font-weight: 700; line-height: 1.3; }
.part > p { margin: 0; color: var(--label); font-size: 15px; line-height: 1.6; }
/* réglages : la page elle-même en haut de l'About, sur toute la largeur, comme l'écran de la Showcase ; le texte juste en dessous */
.about-lead { margin: 0; font-size: 19px; color: var(--lit); }
.about-lead b { font-weight: 600; }
/* .showcase : identique à Dot Page (en-tête, écran dans son cadre, nom en accent dessous) */
.showcase { display: grid; gap: 16px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.bar h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.hint { margin: 0; color: var(--label); font-size: 14px; }
.edge { padding: clamp(6px, 1.2%, 18px); border-radius: clamp(10px, 1.6vw, 24px); background: linear-gradient(180deg, #161616, #0b0b0b); border: 1px solid #2a2a2a; box-shadow: 0 40px 80px -40px #000, inset 0 1px 0 #262626; }
.shot { display: block; }
.shot video { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; border-radius: clamp(4px, .8vw, 10px); background: var(--bg); }
.pager { display: flex; justify-content: center; }
.where { font-family: var(--mono); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
.where:hover { color: var(--lit); }
code { font-family: var(--mono); font-size: .88em; color: var(--lit); background: #161616; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }

.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; color: var(--label); font-size: 15px; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--mono); font-weight: 500; font-size: 14px; }
.steps b { color: var(--lit); font-weight: 600; }
/* étapes brèves : un verbe, puis un repère en petit */
.steps li > span, .steps li > a { display: grid; gap: 2px; }
.steps small { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
/* la 1re étape est le téléchargement : toute la carte est le lien, en émeraude */
.steps li.dl { position: relative; background: var(--accent); border-color: var(--accent); }
.steps li.dl::before { background: var(--bg); color: var(--accent); }
.steps li.dl a { color: var(--bg); text-decoration: none; }
.steps li.dl a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.steps li.dl b, .steps li.dl small { color: var(--bg); }
.steps li.dl:hover { filter: brightness(1.1); }
.note { margin: 0; padding: 16px 20px; border: 1px solid #2a2414; border-radius: 14px; background: #0f0d08; color: var(--label); font-size: 15px; }
.note b { color: var(--wip); font-weight: 600; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { text-align: left; padding: 14px 18px; vertical-align: top; border-bottom: 1px solid var(--line); font-size: 15px; }
tr:last-child td { border-bottom: 0; }
thead th { font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; white-space: nowrap; }
td { color: var(--label); }
td .tagw { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--wip); }

.bullets { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; color: var(--label); }
.bullets li::marker { color: #3a3a3a; }
.bullets b { color: var(--lit); font-weight: 600; }
/* roadmap : un point fait est allumé, suivi de sa version en capsule (lien vers Dot Release) ; un point à faire est éteint */
.bullets li.done { color: var(--lit); }
.bullets li.done::marker { color: var(--accent); }
.bullets li.todo, .bullets li.todo b { color: var(--muted); }
.bullets .when { display: inline-block; margin-left: .6em; padding: 1px 10px; border: 1px solid var(--accent); border-radius: 999px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--accent); text-decoration: none; white-space: nowrap; vertical-align: 1px; }
.bullets .when:hover { background: var(--accent); color: var(--bg); }

.footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-family: var(--mono); font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
.footer .red { color: var(--accent); }
.footer a { color: var(--label); text-decoration: none; }
</style>

      w1: "Dot Hub, the widget you place in iCUE, only shows what the companion sends it: the home screen, then the dot you tap. The dots are built into the companion, and iCUE sensors, FPS and now playing are passed on to them. Without it, Dot Hub waits.", w2: "The ⚙ SETTINGS button opens a page in your PC browser: the Edge live, each dot's options, colors shared by all. A change made on one side shows up on the other within seconds, and everything fits in a single file.", w3: "An iCUE widget cannot see your PC. The companion can: it reads Steam files (installed games, downloads, covers) and launches a game with a tap. Soon it will control Windows sound and talk to Discord, Plex or Home Assistant.", w4: "It only listens on your PC and rejects pages pretending to be it. No analytics, no account: it only goes online for a feature you use. Keys and tokens are encrypted (DPAPI) and never sent back in clear.",
      w1t: "It serves Dot Hub", 
      w2t: "It keeps the settings", 
      w3t: "It does what a widget cannot", 
      w4t: "It protects your data", 
      installK: "Install",
      s1: "<b>Download ↗</b><small>the app and the widget</small>",
      s2: "<b>Run Dot Companion</b><small>on your PC</small>",
      s3: "<b>Add Dot Hub</b><small>to your Edge, in iCUE</small>",
      s4: "<b>Add your dots</b><small>tap +</small>",
      smart: "<b>Windows warning on first launch</b>: the exe is not signed yet, so SmartScreen flags it as unknown. Click \"More info\" then \"Run anyway\".",
      modsK: "What it uses, module by module",
      thModule: "Module", thUses: "On the PC", thNet: "On the Internet",
      clockUses: "The PC time and time zone.", clockNet: "Nothing.",
      bambuUses: "Your Bambu Lab printer on the local network (MQTT over TLS): IP address, serial number and LAN access code, encrypted on the PC.", bambuNet: "Nothing: everything stays on the local network.",
      steamUses: "Steam files (libraries, installed games, downloads, playtime, signed-in account), the registry for the game in progress, <code>steam://</code> to launch a game, open downloads or change your status.",
      steamNet: "Covers missing from the Steam cache (public store images). Friends and status only if you give a Steam API key.",
      otherMods: "Other modules", otherUses: "Each module, once coded, adds its line here: what it reads on the PC and what it asks the Internet for.", soon: "Coming",
      privK: "Privacy",
      nextK: "Roadmap", setK: "On your PC", setLabel: "Settings page preview", setHint: "⚙ SETTINGS on the Edge opens the settings page in your browser.", aboutLead: "Dot Companion runs on your PC, next to iCUE: Dot Hub asks it for everything it shows.", setOpen: "See the settings page →",
      r1: "<b>Listens on your PC only</b> (<code>127.0.0.1:47800</code>): invisible from your local network and from the Internet.",

    }
  };
  var lang = "en";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    lang = q === "en" || q === "fr" ? q : localStorage.getItem("dotpage-lang") || ((navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en"); // français pour un navigateur en français, anglais sinon
  } catch (e) { lang = (navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en"; }
  if (!STR[lang]) lang = "en";
  function t(k) { return STR[lang][k]; }

  // titre COMPANION en points (police 5 × 7 de Dot Page)
  var F = {
    C: [".####", "#....", "#....", "#....", "#....", "#....", ".####"],
    O: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
    M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"],
    P: ["####.", "#...#", "#...#", "####.", "#....", "#....", "#...."],
    A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
    N: ["#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#", "#...#"],
    I: ["###", ".#.", ".#.", ".#.", ".#.", ".#.", "###"]
  };
  function drawTitle(text) {
    var cv = document.getElementById("titleDots"), ctx = cv.getContext("2d"), cols = [];
    text.split("").forEach(function (ch, i) {
      var g = F[ch];
      for (var c = 0; c < g[0].length; c++) cols.push(g.map(function (r) { return r[c] === "#"; }));
      if (i < text.length - 1) cols.push([false, false, false, false, false, false, false]);
    });
    var pad = 1, total = cols.length + pad * 2, rows = 7 + pad * 2;
    // points tous les 14 px : la largeur du titre suit le texte (canvas en double résolution)
    cv.width = total * 14 * 2; cv.style.width = total * 14 + "px";
    var pitch = cv.width / total, r = pitch * 0.36;
    cv.height = Math.round(rows * pitch);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var x = 0; x < total; x++) for (var y = 0; y < rows; y++) {
      var col = cols[x - pad], on = col && y >= pad && y < 7 + pad && col[y - pad];
      ctx.beginPath(); ctx.fillStyle = on ? "#f2f0e9" : "#171717";
      ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, on ? r : r * 0.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  // pictogrammes 7 × 7 des cartes
  var PICS = {
    serve: ["#######", "#.....#", "#.###.#", "#.....#", "#######", "...#...", ".#####."],
    settings: ["...#...", ".#.#.#.", "..###..", "###.###", "..###..", ".#.#.#.", "...#..."],
    power: ["....##.", "...##..", "..##...", ".#####.", "...##..", "..##...", ".##...."],
    lock: ["..###..", ".#...#.", ".#...#.", "#######", "###.###", "###.###", "#######"]
  };
  function drawPics() {
    document.querySelectorAll("canvas[data-pic]").forEach(function (cv) {
      var g = PICS[cv.getAttribute("data-pic")], ctx = cv.getContext("2d"), p = cv.width / 7;
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
        ctx.beginPath(); ctx.fillStyle = g[y][x] === "#" ? "#10b981" : "#1c1c1c";
        ctx.arc(x * p + p / 2, y * p + p / 2, p * 0.38, 0, Math.PI * 2); ctx.fill();
      }
    });
  }

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (e) { e.textContent = t(e.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (e) { e.innerHTML = t(e.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-label]").forEach(function (e) { e.setAttribute("aria-label", t(e.getAttribute("data-i18n-label"))); });
    document.querySelectorAll(".lang .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
  }
  document.querySelectorAll(".lang .chip").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem("dotpage-lang", lang); } catch (e) {} render(); });
  });

  drawTitle("COMPANION");
  drawPics();
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // vidéo des réglages : pas de lecture automatique si le système demande moins d'animations
  if (calm) document.querySelectorAll(".shot video").forEach(function (v) { v.removeAttribute("autoplay"); v.pause(); });
  render();
})();
</script>
